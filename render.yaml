services:
  - type: web
    name: pearlsky
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Jwt__Secret
        generateValue: true
      - key: Jwt__Issuer
        value: PearlSky
      - key: Jwt__Audience
        value: PearlSkyApp
      - key: Payment__Mode
        value: Gateway
      - key: Email__Enabled
        value: "false"
