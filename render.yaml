services:
  - type: web
    name: jetflux
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Jwt__Secret
        generateValue: true
      - key: Jwt__Issuer
        value: JetFlux
      - key: Jwt__Audience
        value: JetFluxApp
      - key: Payment__Mode
        value: Gateway
      - key: Email__Enabled
        value: "false"
